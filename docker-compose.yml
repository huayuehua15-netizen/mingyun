services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.21}
    environment:
      APP_SECRET: ${APP_SECRET:-change-me-in-production-please}
      MINGYUN_AI_BASE_URL: ${MINGYUN_AI_BASE_URL:-}
      MINGYUN_AI_API_KEY: ${MINGYUN_AI_API_KEY:-}
      MINGYUN_AI_MODEL: ${MINGYUN_AI_MODEL:-}
      MINGYUN_AI_TIMEOUT: ${MINGYUN_AI_TIMEOUT:-90s}
      MINGYUN_AI_MAX_TOKENS: ${MINGYUN_AI_MAX_TOKENS:-1200}
      MINGYUN_AI_TEMPERATURE: ${MINGYUN_AI_TEMPERATURE:-0.5}
      MINGYUN_DATA_DIR: /data
      MINGYUN_MODEL_SETTINGS: ${MINGYUN_MODEL_SETTINGS:-on}
    expose:
      - "8080"
    volumes:
      - mingyun-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mingyun-data:
