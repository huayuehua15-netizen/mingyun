name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            paipan/go.sum
            apps/api/go.sum

      - name: 检查格式
        run: |
          files=$(find paipan apps/api -name '*.go')
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          (cd paipan && go vet ./...)
          (cd apps/api && go vet ./...)

      - name: go test
        run: |
          (cd paipan && go test -race -count=1 ./...)
          (cd apps/api && go test -race -count=1 ./...)

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建
        run: npm run build

  docker:
    name: 镜像构建与冒烟
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建 API 镜像
        run: docker build -t mingyun:ci .

      - name: 构建 Web 镜像
        run: docker build -t mingyun-web:ci apps/web

      - name: 冒烟测试
        run: |
          set -e
          trap 'docker stop mingyun-ci >/dev/null 2>&1 || true' EXIT

          docker run --rm mingyun:ci version
          docker run -d --name mingyun-ci -p 8080:8080 \
            -e APP_SECRET=0123456789abcdef0123456789abcdef \
            mingyun:ci serve

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:8080/healthz

          resp=$(curl -fsS -X POST http://localhost:8080/api/v1/charts/liuyao/cast \
            -H 'Content-Type: application/json' \
            -d '{"mode":"coin","question":"ci"}')
          echo "$resp"
          echo "$resp" | grep -q '"code":0'
